# Read the Docs configuration file for TurnFix
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # Cancel building pull requests when a new commit is pushed
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git show -s --format=%B $READTHEDOCS_GIT_IDENTIFIER | grep -q '\[skip ci\]'; then
          echo "Skipping CI build"
          exit 183
        fi
    post_install:
      # Install any additional Python packages needed
      - pip install --upgrade pip
      - pip install mkdocs-material pymdown-extensions

# Build documentation in the docs/ directory with MkDocs
mkdocs:
  configuration: mkdocs.yml
  # Optionally fail the build on any MkDocs warnings
  fail_on_warning: false

# Optionally declare the Python requirements required to build your docs
python:
  install:
    - requirements: requirements-docs.txt

# Formats (PDF, EPUB, HTMLZip)
formats:
  - pdf
  - epub
