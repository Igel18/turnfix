<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurnFix Icons Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .icon-test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .icon-test img { width: 32px; height: 32px; margin-right: 10px; }
        .success { background-color: #e7f5e7; }
        .error { background-color: #fde7e7; }
    </style>
</head>
<body>
    <h1>TurnFix Icons Debug</h1>
    <p>Teste die Icon-URLs für verschiedene Disziplinen:</p>
    
    <div id="icon-tests"></div>

    <script>
        // Icon-Test-Daten
        const testIcons = [
            { name: 'Boden', icon: ':/icons/boden.png' },
            { name: 'Sprung', icon: ':/icons/sprung.png' },
            { name: 'Barren', icon: ':/icons/barren.png' },
            { name: 'Reck', icon: ':/icons/reck.png' },
            { name: 'Ringe', icon: ':/icons/ringe.png' },
            { name: 'Pauschenpferd', icon: ':/icons/seitpferd.png' },
            { name: 'Stufenbarren', icon: ':/icons/barren.png' },
            { name: 'Balken', icon: ':/icons/balken.png' }
        ];

        // Icon-URL-Konvertierung (wie in iconUtils.ts)
        function getIconUrl(iconPath) {
            if (!iconPath) return null;
            
            if (iconPath.startsWith(':/icons/')) {
                const filename = iconPath.substring(':/icons/'.length);
                return `http://localhost:3001/public/icons/${filename}`;
            }
            
            if (iconPath.startsWith(':/')) {
                const filename = iconPath.substring(2);
                return `http://localhost:3001/public/${filename}`;
            }
            
            if (iconPath.startsWith('/') || iconPath.startsWith('http')) {
                return iconPath;
            }
            
            return `http://localhost:3001/public/icons/${iconPath}`;
        }

        // Icons testen
        const container = document.getElementById('icon-tests');
        
        testIcons.forEach(({ name, icon }) => {
            const url = getIconUrl(icon);
            const div = document.createElement('div');
            div.className = 'icon-test';
            
            const img = document.createElement('img');
            img.src = url;
            img.alt = name;
            
            div.innerHTML = `
                <strong>${name}</strong><br>
                Qt-Pfad: <code>${icon}</code><br>
                Web-URL: <code>${url}</code><br>
                Status: <span id="status-${name.replace(/\s+/g, '')}">Lädt...</span>
            `;
            
            img.onload = () => {
                div.className = 'icon-test success';
                document.getElementById(`status-${name.replace(/\s+/g, '')}`).textContent = '✅ Geladen';
                div.insertBefore(img, div.firstChild);
            };
            
            img.onerror = () => {
                div.className = 'icon-test error';
                document.getElementById(`status-${name.replace(/\s+/g, '')}`).textContent = '❌ Fehler';
            };
            
            container.appendChild(div);
        });
    </script>
</body>
</html>
