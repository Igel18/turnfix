<!DOCTYPE html>
<html>
<head>
    <title>Test XML Upload</title>
</head>
<body>
    <h1>Test DTB Gymnet XML Import</h1>
    
    <form id="uploadForm" enctype="multipart/form-data">
        <div>
            <label for="xmlFile">Select XML File:</label>
            <input type="file" id="xmlFile" name="xmlFile" accept=".xml" required>
        </div>
        <br>
        <button type="submit">Upload and Parse XML</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const fileInput = document.getElementById('xmlFile');
            formData.append('xmlFile', fileInput.files[0]);
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            try {
                const response = await fetch('/api/events/import-gymnet', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <h3 style="color: green;">Success!</h3>
                        <p>${result.message}</p>
                        <pre>${JSON.stringify(result.data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 style="color: red;">Error!</h3>
                        <p>${result.message}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 style="color: red;">Network Error!</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
